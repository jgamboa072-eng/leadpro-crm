<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadPro CRM</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F5F6FA; color: #1A1D2E; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD0E0; border-radius: 99px; }

    .app { display: flex; height: 100vh; overflow: hidden; }

    /* SIDEBAR */
    .sidebar { width: 240px; min-width: 240px; background: #0A2463; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; transition: width 0.25s ease; }
    .sidebar.collapsed { width: 64px; min-width: 64px; }
    .sidebar-logo { padding: 22px 18px 18px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); cursor: pointer; }
    .logo-text { font-size: 15px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; line-height: 1.2; }
    .logo-text span { color: #FF6B35; }
    .logo-sub { font-size: 9px; font-weight: 600; color: rgba(255,255,255,0.35); letter-spacing: 0.08em; }
    .sidebar-nav { flex: 1; padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
    .nav-label { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.28); letter-spacing: 0.1em; text-transform: uppercase; padding: 8px 10px 4px; white-space: nowrap; overflow: hidden; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: all 0.15s; color: rgba(255,255,255,0.55); font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; }
    .nav-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
    .nav-item.active { background: rgba(255,107,53,0.2); color: #FF6B35; }
    .nav-icon { font-size: 16px; min-width: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .nav-badge { margin-left: auto; background: #FF6B35; color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 99px; min-width: 18px; text-align: center; }
    .sidebar-footer { padding: 14px 10px; border-top: 1px solid rgba(255,255,255,0.08); }

    /* MAIN */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* HEADER */
    .header { height: 62px; min-height: 62px; background: #fff; border-bottom: 1px solid #E8EAF2; display: flex; align-items: center; gap: 14px; padding: 0 22px; }
    .header-toggle { width: 34px; height: 34px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #6B7099; font-size: 18px; transition: background 0.15s; }
    .header-toggle:hover { background: #F0F2FA; }
    .search-wrap { flex: 1; max-width: 380px; position: relative; }
    .search-input { width: 100%; height: 37px; background: #F5F6FA; border: 1.5px solid #E8EAF2; border-radius: 10px; padding: 0 14px 0 38px; font-family: inherit; font-size: 13px; color: #1A1D2E; outline: none; transition: border-color 0.15s, background 0.15s; }
    .search-input:focus { border-color: #0A2463; background: #fff; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #9EA3BD; font-size: 14px; pointer-events: none; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .header-btn { width: 36px; height: 36px; border: none; background: #F5F6FA; border-radius: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #6B7099; font-size: 16px; transition: all 0.15s; position: relative; }
    .header-btn:hover { background: #E8EAF2; color: #0A2463; }
    .notif-dot { position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; background: #FF6B35; border-radius: 50%; border: 1.5px solid #fff; }
    .user-avatar { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; }
    .user-info { margin-left: 2px; }
    .user-name { font-size: 13px; font-weight: 700; color: #1A1D2E; }
    .user-role { font-size: 11px; color: #9EA3BD; }

    /* CONTENT */
    .content { flex: 1; overflow-y: auto; padding: 26px 26px; }
    .page-header { margin-bottom: 24px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .page-title { font-size: 21px; font-weight: 800; color: #1A1D2E; margin-bottom: 3px; }
    .page-sub { font-size: 13px; color: #9EA3BD; }

    /* BUTTONS */
    .btn { display: inline-flex; align-items: center; gap: 7px; padding: 0 18px; height: 38px; border-radius: 10px; font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; border: none; transition: all 0.15s; }
    .btn-primary { background: #FF6B35; color: #fff; }
    .btn-primary:hover { background: #e85e2a; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(255,107,53,0.3); }
    .btn-outline { background: #fff; color: #1A1D2E; border: 1.5px solid #E8EAF2; }
    .btn-outline:hover { border-color: #C0C4D8; background: #F5F6FA; }

    /* KPI */
    .kpi-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 22px; }
    .kpi-card { background: #fff; border-radius: 14px; padding: 20px 18px; box-shadow: 0 1px 3px rgba(10,36,99,0.05), 0 4px 14px rgba(10,36,99,0.04); display: flex; flex-direction: column; gap: 12px; transition: transform 0.15s, box-shadow 0.15s; position: relative; overflow: hidden; }
    .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(10,36,99,0.1); }
    .kpi-accent { position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 14px 14px 0 0; }
    .kpi-top { display: flex; align-items: flex-start; justify-content: space-between; }
    .kpi-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .kpi-trend { display: flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 99px; }
    .trend-up { background: #E8FAF0; color: #22C55E; }
    .trend-dn { background: #FFF0EC; color: #FF6B35; }
    .kpi-value { font-size: 28px; font-weight: 800; color: #1A1D2E; line-height: 1; }
    .kpi-label { font-size: 12px; color: #9EA3BD; font-weight: 500; margin-top: 2px; }

    /* CARDS */
    .card { background: #fff; border-radius: 14px; box-shadow: 0 1px 3px rgba(10,36,99,0.05), 0 4px 14px rgba(10,36,99,0.04); overflow: hidden; }
    .card-header { padding: 16px 18px 0; display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .card-title { font-size: 14px; font-weight: 700; color: #1A1D2E; }
    .card-sub { font-size: 11.5px; color: #9EA3BD; margin-top: 2px; }
    .card-action { font-size: 12px; color: #FF6B35; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 3px; }

    /* BOTTOM GRID */
    .bottom-grid { display: grid; grid-template-columns: 1fr 1.55fr; gap: 18px; }

    /* COUNTRY CHART */
    .chart-wrap { padding: 14px 18px 18px; }
    .country-item { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .country-info { display: flex; align-items: center; justify-content: space-between; }
    .country-name { font-size: 13px; font-weight: 600; color: #1A1D2E; display: flex; align-items: center; gap: 6px; }
    .country-count { font-size: 12.5px; font-weight: 700; color: #0A2463; }
    .country-pct { font-size: 11px; color: #9EA3BD; font-weight: 500; margin-left: 6px; }
    .bar-track { height: 7px; background: #F0F2FA; border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; transition: width 1.2s cubic-bezier(0.34,1.56,0.64,1); }

    /* TABLE */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead tr { border-bottom: 1.5px solid #F0F2FA; }
    th { padding: 9px 14px; text-align: left; font-size: 10.5px; font-weight: 700; color: #9EA3BD; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; cursor: pointer; user-select: none; }
    th:hover { color: #6B7099; }
    td { padding: 12px 14px; font-size: 13px; color: #1A1D2E; border-bottom: 1px solid #F5F6FA; }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.12s; cursor: pointer; }
    tbody tr:hover td { background: #F9FAFD; }
    tbody tr.selected td { background: #EEF4FF; }
    .lead-avatar { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #fff; flex-shrink: 0; }
    .lead-name-cell { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .country-cell { display: flex; align-items: center; gap: 5px; }
    .vendor-cell { display: flex; align-items: center; gap: 6px; }
    .vendor-dot { width: 22px; height: 22px; border-radius: 6px; background: #E8EAF2; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #6B7099; }

    /* BADGES */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .b-nuevo      { background:#EEF4FF; color:#3B82F6; }  .b-nuevo .badge-dot      { background:#3B82F6; }
    .b-contactado { background:#FFF4EE; color:#FF6B35; }  .b-contactado .badge-dot { background:#FF6B35; }
    .b-enproceso  { background:#FFFBEA; color:#F59E0B; }  .b-enproceso .badge-dot  { background:#F59E0B; }
    .b-cerrado    { background:#EDFAF4; color:#22C55E; }  .b-cerrado .badge-dot    { background:#22C55E; }

    /* FILTERS */
    .filters-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-select { height: 36px; padding: 0 12px; background: #fff; border: 1.5px solid #E8EAF2; border-radius: 9px; font-family: inherit; font-size: 13px; color: #1A1D2E; outline: none; cursor: pointer; transition: border-color 0.15s; }
    .filter-select:focus { border-color: #0A2463; }
    .filter-search { height: 36px; padding: 0 12px 0 36px; background: #fff; border: 1.5px solid #E8EAF2; border-radius: 9px; font-family: inherit; font-size: 13px; color: #1A1D2E; outline: none; transition: border-color 0.15s; flex: 1; min-width: 180px; max-width: 280px; }
    .filter-search:focus { border-color: #0A2463; }
    .filter-wrap { position: relative; }
    .filter-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: #C0C4D8; font-size: 13px; pointer-events: none; }
    .filter-tag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; background: #EEF4FF; border-radius: 99px; font-size: 11.5px; font-weight: 600; color: #0A2463; cursor: pointer; }
    .filter-tag:hover { background: #dce8ff; }

    /* VENDEDORES */
    .sellers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .seller-card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 1px 3px rgba(10,36,99,0.05), 0 4px 14px rgba(10,36,99,0.04); transition: transform 0.15s, box-shadow 0.15s; cursor: pointer; position: relative; overflow: hidden; }
    .seller-card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(10,36,99,0.1); }
    .seller-card-accent { position: absolute; top: 0; left: 0; right: 0; height: 4px; border-radius: 16px 16px 0 0; }
    .seller-avatar-wrap { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .seller-avatar { width: 52px; height: 52px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #fff; flex-shrink: 0; }
    .seller-name { font-size: 15px; font-weight: 800; color: #1A1D2E; margin-bottom: 2px; }
    .seller-role { font-size: 12px; color: #9EA3BD; font-weight: 500; }
    .seller-countries { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 16px; }
    .country-pill { display: flex; align-items: center; gap: 4px; padding: 3px 8px; background: #F5F6FA; border-radius: 99px; font-size: 11.5px; font-weight: 600; color: #6B7099; }
    .seller-metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .metric-box { background: #F9FAFD; border-radius: 10px; padding: 10px 8px; text-align: center; }
    .metric-val { font-size: 18px; font-weight: 800; color: #1A1D2E; line-height: 1; }
    .metric-label { font-size: 10px; color: #9EA3BD; font-weight: 600; margin-top: 3px; letter-spacing: 0.02em; }
    .perf-bar { height: 5px; background: #F0F2FA; border-radius: 99px; overflow: hidden; margin-top: 14px; }
    .perf-fill { height: 100%; border-radius: 99px; transition: width 1s ease; }
    .perf-label { display: flex; justify-content: space-between; margin-top: 5px; font-size: 11px; }
    .perf-text { color: #9EA3BD; font-weight: 500; }
    .perf-pct { font-weight: 700; }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(10,36,99,0.45); display: flex; align-items: center; justify-content: center; z-index: 900; backdrop-filter: blur(4px); animation: fadeIn 0.2s ease; }
    .modal { background: #fff; border-radius: 18px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(10,36,99,0.2); animation: slideUp 0.22s ease; }
    .modal-header { padding: 22px 24px 0; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .modal-title { font-size: 17px; font-weight: 800; color: #1A1D2E; }
    .modal-close { width: 30px; height: 30px; border: none; background: #F5F6FA; border-radius: 8px; cursor: pointer; font-size: 14px; color: #6B7099; transition: background 0.15s; display: flex; align-items: center; justify-content: center; }
    .modal-close:hover { background: #E8EAF2; color: #1A1D2E; }
    .modal-body { padding: 0 24px 24px; display: flex; flex-direction: column; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 12px; font-weight: 700; color: #1A1D2E; letter-spacing: 0.01em; }
    .form-input { height: 40px; padding: 0 12px; background: #F5F6FA; border: 1.5px solid #E8EAF2; border-radius: 9px; font-family: inherit; font-size: 13px; color: #1A1D2E; outline: none; transition: border-color 0.15s, background 0.15s; }
    .form-input:focus { border-color: #0A2463; background: #fff; }
    .form-select { height: 40px; padding: 0 12px; background: #F5F6FA; border: 1.5px solid #E8EAF2; border-radius: 9px; font-family: inherit; font-size: 13px; color: #1A1D2E; outline: none; cursor: pointer; }
    .form-select:focus { border-color: #0A2463; background: #fff; }
    .form-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; padding-top: 6px; }

    /* NOTIF DROPDOWN */
    .notif-dropdown { position: absolute; top: calc(100% + 8px); right: 0; width: 270px; background: #fff; border: 1px solid #E8EAF2; border-radius: 13px; box-shadow: 0 8px 30px rgba(10,36,99,0.12); z-index: 200; overflow: hidden; }
    .notif-hd { padding: 12px 14px; border-bottom: 1px solid #F0F2FA; font-size: 13px; font-weight: 700; color: #1A1D2E; }
    .notif-item { padding: 10px 14px; display: flex; gap: 10px; align-items: flex-start; cursor: pointer; transition: background 0.12s; }
    .notif-item:hover { background: #F9FAFD; }
    .notif-icon { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
    .notif-text { font-size: 12px; font-weight: 600; color: #1A1D2E; line-height: 1.4; }
    .notif-time { font-size: 11px; color: #9EA3BD; margin-top: 2px; }

    /* ANIMATIONS */
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }

    /* EMPTY */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 60px 20px; color: #C0C4D8; }
    .empty-icon { font-size: 40px; opacity: 0.4; }
    .empty-text { font-size: 14px; font-weight: 600; }
    .empty-sub  { font-size: 13px; color: #D5D8E8; }

    @media (max-width: 1100px) { .kpi-grid { grid-template-columns: repeat(2,1fr); } .bottom-grid { grid-template-columns: 1fr; } .user-info { display:none; } }
    @media (max-width: 700px) { .sidebar { width:64px; min-width:64px; } .kpi-grid { grid-template-columns:1fr; } .content { padding:16px; } }

    /* ── DEMO LANDING PAGE (scoped) ── */
    .demo-page{font-family:'Plus Jakarta Sans',sans-serif;color:#1A1D2E;background:#fff;height:100vh;overflow-y:auto;width:100%;}
    .demo-page *,.demo-page *::before,.demo-page *::after{box-sizing:border-box;}
    .demo-page .demo-nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,0.93);backdrop-filter:blur(20px);border-bottom:1px solid rgba(10,36,99,0.08);height:64px;display:flex;align-items:center;padding:0 56px;gap:32px;}
    .demo-page .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;}
    .demo-page .nav-logo-text{font-size:17px;font-weight:900;color:#0A2463;letter-spacing:-0.02em;}
    .demo-page .nav-logo-text span{color:#FF6B35;}
    .demo-page .nav-links{display:flex;gap:28px;margin-left:auto;align-items:center;}
    .demo-page .nav-link{font-size:13.5px;font-weight:500;color:#6B7099;cursor:pointer;transition:color 0.15s;text-decoration:none;}
    .demo-page .nav-link:hover{color:#0A2463;}
    .demo-page .nav-cta{height:38px;padding:0 22px;background:#FF6B35;color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:all 0.15s;text-decoration:none;display:flex;align-items:center;}
    .demo-page .nav-cta:hover{background:#e85e2a;box-shadow:0 4px 14px rgba(255,107,53,0.35);transform:translateY(-1px);}
    .demo-page .nav-admin{height:38px;padding:0 18px;background:#EEF4FF;color:#0A2463;border:none;border-radius:10px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:all 0.15s;text-decoration:none;display:flex;align-items:center;gap:6px;}
    .demo-page .nav-admin:hover{background:#dce8ff;}
    .demo-page .hero{min-height:100vh;position:relative;display:flex;align-items:center;overflow:hidden;padding:60px 56px 60px;}
    .demo-page .hero-bg{position:absolute;inset:0;background:linear-gradient(135deg,#06112E 0%,#0A2463 50%,#0d3080 100%);z-index:0;}
    .demo-page .orb{position:absolute;border-radius:50%;filter:blur(80px);animation:demoFloat 8s ease-in-out infinite;pointer-events:none;}
    .demo-page .orb1{width:500px;height:500px;background:rgba(255,107,53,0.18);top:-100px;right:-100px;}
    .demo-page .orb2{width:350px;height:350px;background:rgba(99,102,241,0.15);bottom:-80px;left:10%;animation-delay:3s;}
    .demo-page .orb3{width:200px;height:200px;background:rgba(255,107,53,0.1);top:40%;left:40%;animation-delay:5s;}
    @keyframes demoFloat{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(30px,-20px) scale(1.05);}66%{transform:translate(-20px,10px) scale(0.97);}}
    .demo-page .hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);background-size:60px 60px;z-index:1;pointer-events:none;}
    .demo-page .hero-content{position:relative;z-index:2;max-width:600px;}
    .demo-page .hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,107,53,0.15);border:1px solid rgba(255,107,53,0.3);border-radius:99px;padding:7px 16px;font-size:12px;font-weight:700;color:#FF6B35;margin-bottom:24px;letter-spacing:0.04em;}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

}

// Interest badge
function InterestBadge({ interest }) {
  const cfg = INTERESTS[interest] || {color:"#9EA3BD",bg:"#F5F6FA"};
  const icon = INTEREST_ICONS[interest] || "⚙️";
  return (
    <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 9px",borderRadius:99,fontSize:11,fontWeight:600,background:cfg.bg,color:cfg.color}}>
      {icon} {interest}
    </span>
  );
}

// Chat timeline bubble
function ChatBubble({ msg }) {
  const isUser  = msg.role === "user";
  const isAgent = msg.role === "agent";
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:isUser?"flex-end":"flex-start",gap:3,marginBottom:10}}>
      {isAgent && <div style={{fontSize:10,fontWeight:700,color:"#FF6B35",marginLeft:36}}>{msg.agent}</div>}
      <div style={{display:"flex",alignItems:"flex-end",gap:6,flexDirection:isUser?"row-reverse":"row"}}>
        {!isUser && (
          <div style={{width:24,height:24,borderRadius:7,background:isAgent?"#FF6B35":"#0A2463",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,flexShrink:0}}>
            {isAgent?"👤":"🤖"}
          </div>
        )}
        <div style={{
          maxWidth:"75%",padding:"8px 12px",borderRadius:isUser?"12px 12px 4px 12px":"12px 12px 12px 4px",
          background:isUser?"#0A2463":isAgent?"#FFF4EE":"#F5F6FA",
          color:isUser?"#fff":isAgent?"#FF6B35":"#1A1D2E",
          fontSize:12.5,lineHeight:1.5,
        }}>{msg.text}</div>
      </div>
      <div style={{fontSize:10,color:"#C0C4D8",marginLeft:isUser?0:30}}>{msg.time}</div>
    </div>
  );
}

// Lead Drawer

  const [activeTab, setActiveTab] = React.useState("perfil");

  React.useEffect(()=>{
    if(chatEndRef.current) chatEndRef.current.scrollTop = chatEndRef.current.scrollHeight;

  const sendMsg = () => {
    if(!chatInput.trim()) return;
    setChatMsgs(prev=>[...prev, {role:"agent",time:"Ahora",text:chatInput,agent:"Carlos M."}]);
    setChatInput("");
    setTimeout(()=>{
      setChatMsgs(prev=>[...prev,{role:"bot",time:"Ahora",text:"Mensaje registrado. El lead será notificado por "+ (lead.channel||"email") +". 📬"}]);

function LeadsPage({ accent, primary }) {
  const [search, setSearch]       = React.useState("");
  const [filterCountry, setFC]    = React.useState("Todos");
  const [filterState, setFS]      = React.useState("Todos");
  const [filterVendor, setFV]     = React.useState("Todos");
  const [filterSource, setFSrc]   = React.useState("Todos");
  const [filterInterest, setFInt] = React.useState("Todos");
  const [sortCol, setSortCol]     = React.useState("date");
  const [sortDir, setSortDir]     = React.useState("desc");
  const [showModal, setShowModal] = React.useState(false);
  const [drawerLead, setDrawerLead] = React.useState(null);
  const [localLeads, setLocalLeads] = React.useState(ALL_LEADS);

  const filtered = localLeads.filter(l => {
    const q = search.toLowerCase();
    return (!q || l.name.toLowerCase().includes(q) || l.email.toLowerCase().includes(q))
      && (filterCountry==="Todos"  || l.country===filterCountry)
      && (filterState==="Todos"    || l.state===filterState)
      && (filterVendor==="Todos"   || l.vendor===filterVendor)
      && (filterSource==="Todos"   || l.source===filterSource)
      && (filterInterest==="Todos" || l.interest===filterInterest);
  });

  const sorted = [...filtered].sort((a,b)=>{
    const dir = sortDir==="asc"?1:-1;
    if(sortCol==="name")  return dir*a.name.localeCompare(b.name);
    if(sortCol==="value") return dir*(a.value-b.value);
    if(sortCol==="date")  return dir*a.date.localeCompare(b.date);
    return 0;
  });

  const handleSort = col => {
    if(sortCol===col) setSortDir(d=>d==="asc"?"desc":"asc");
    else { setSortCol(col); setSortDir("asc"); }
  };

  const stateCount = st => localLeads.filter(l=>l.state===st).length;

  const handleSave = form => {
    const colors = ["#6366F1","#FF6B35","#8B5CF6","#0EA5E9","#22C55E","#F59E0B"];
    const flagMap = {Chile:"🇨🇱",México:"🇲🇽",España:"🇪🇸",Panamá:"🇵🇦",Venezuela:"🇻🇪",Argentina:"🇦🇷",EEUU:"🇺🇸"};
    setLocalLeads(prev=>[{
      id:Date.now(), ...form,
      flag:flagMap[form.country]||"🌍",
      color:colors[Math.floor(Math.random()*colors.length)],
      email:form.email||"—", phone:form.phone||"—",
      value:Number(form.value)||0,
      date:new Date().toLocaleDateString("es-CL",{day:"2-digit",month:"short",year:"numeric"}),
      source:form.source||"Web", interest:form.interest||"Servicio",
      lastContact:"Hoy", channel:form.channel||"Email",
      pages:["inicio"], timeOnSite:"0m",
    },...prev]);
    setShowModal(false);
  };

  const BADGE_MAP = {
    "Nuevo":      {cls:"b-nuevo",     label:"Nuevo"},
    "Contactado": {cls:"b-contactado",label:"Contactado"},
    "En proceso": {cls:"b-enproceso", label:"En proceso"},
    "Cerrado":    {cls:"b-cerrado",   label:"Cerrado"},
  };

  const fmtMoney = n => n>=1000?`$${(n/1000).toFixed(1)}k`:`$${n}`;

  return (
    <div className="content" style={{paddingRight: drawerLead?480:26, transition:"padding-right 0.25s ease"}}>
      {drawerLead && <LeadDrawer lead={drawerLead} onClose={()=>setDrawerLead(null)} accent={accent} primary={primary}/>}

      {showModal && (
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowModal(false)}>
          <div className="modal">
            <div className="modal-header">
              <div className="modal-title">Nuevo Lead</div>
              <button className="modal-close" onClick={()=>setShowModal(false)}>✕</button>
            </div>
            <NewLeadForm onSave={handleSave} onClose={()=>setShowModal(false)} accent={accent}/>
          </div>
        </div>
      )}

      <div className="page-header">
        <div>
          <div className="page-title">Leads</div>
          <div className="page-sub">{sorted.length} de {localLeads.length} registros</div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn btn-outline">📥 Importar</button>
          <button className="btn btn-outline">📤 Exportar</button>
          <button className="btn btn-primary" style={{background:accent}} onClick={()=>setShowModal(true)}>+ Nuevo Lead</button>
        </div>
      </div>

      {/* Status pills */}
      <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
        {[
          {label:"Total",     val:localLeads.length,        color:primary,   bg:"#EEF4FF"},
          {label:"Nuevo",     val:stateCount("Nuevo"),      color:"#3B82F6", bg:"#EEF4FF"},
          {label:"Contactado",val:stateCount("Contactado"), color:"#FF6B35", bg:"#FFF4EE"},
          {label:"En proceso",val:stateCount("En proceso"), color:"#F59E0B", bg:"#FFFBEA"},
          {label:"Cerrado",   val:stateCount("Cerrado"),    color:"#22C55E", bg:"#EDFAF4"},
        ].map(p=>(
          <div key={p.label} onClick={()=>setFS(p.label==="Total"?"Todos":p.label)}
            style={{display:"flex",alignItems:"center",gap:5,padding:"5px 12px",borderRadius:99,background:p.bg,cursor:"pointer"}}>
            <span style={{fontSize:16,fontWeight:800,color:p.color}}>{p.val}</span>
            <span style={{fontSize:11.5,fontWeight:600,color:p.color}}>{p.label}</span>
          </div>
        ))}
      </div>

      {/* Filters */}
      <div className="filters-bar">
        <div className="filter-wrap">
          <span className="filter-icon">🔍</span>
          <input className="filter-search" placeholder="Buscar nombre, email…" value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <select className="filter-select" value={filterCountry} onChange={e=>setFC(e.target.value)}>
          <option>Todos</option>
          {["Chile","México","España","Panamá","Venezuela"].map(c=><option key={c}>{c}</option>)}
        </select>
        <select className="filter-select" value={filterState} onChange={e=>setFS(e.target.value)}>
          <option>Todos</option>
          {["Nuevo","Contactado","En proceso","Cerrado"].map(s=><option key={s}>{s}</option>)}
        </select>
        <select className="filter-select" value={filterVendor} onChange={e=>setFV(e.target.value)}>
          <option>Todos</option>
          {["Carlos M.","Ana P.","Luis T.","María G."].map(v=><option key={v}>{v}</option>)}
        </select>
        <select className="filter-select" value={filterSource} onChange={e=>setFSrc(e.target.value)}>
          <option>Todos</option>
          {Object.keys(SOURCES).map(s=><option key={s}>{s}</option>)}
        </select>
        <select className="filter-select" value={filterInterest} onChange={e=>setFInt(e.target.value)}>
          <option>Todos</option>
          {["Auto","Propiedad","Servicio"].map(i=><option key={i}>{i}</option>)}
        </select>
        {(filterCountry!=="Todos"||filterState!=="Todos"||filterVendor!=="Todos"||filterSource!=="Todos"||filterInterest!=="Todos"||search) && (
          <span className="filter-tag" onClick={()=>{setFC("Todos");setFS("Todos");setFV("Todos");setFSrc("Todos");setFInt("Todos");setSearch("");}}>✕ Limpiar</span>
        )}
      </div>

      <div className="card">
        <div className="table-wrap">
          <table>
            <thead><tr>
              <th onClick={()=>handleSort("name")}>Nombre {sortCol==="name"?(sortDir==="asc"?"↑":"↓"):""}</th>
              <th>País</th>
              <th>Fuente</th>
              <th>Interés</th>
              <th>Vendedor</th>
              <th>Estado</th>
              <th onClick={()=>handleSort("value")}>Valor {sortCol==="value"?(sortDir==="asc"?"↑":"↓"):""}</th>
              <th>Último contacto</th>

                    <td><div className="country-cell"><span>{l.flag}</span>{l.country}</div></td>
                    <td><SourceChip source={l.source}/></td>
                    <td><InterestBadge interest={l.interest}/></td>
                    <td><div className="vendor-cell"><div className="vendor-dot">{l.vendor.split(" ").map(w=>w[0]).join("")}</div>{l.vendor}</div></td>
                    <td><span className={`badge ${badge.cls}`}><span className="badge-dot"/>{badge.label}</span></td>
                    <td style={{fontWeight:700,color:primary}}>{fmtMoney(l.value)}</td>
                    <td style={{color:"#9EA3BD",fontSize:12}}>{l.lastContact}</td>
                    <td style={{fontSize:15}}>{CHANNEL_ICONS[l.channel]||"📡"}</td>
                    <td style={{color:"#9EA3BD",fontSize:12}}>{l.date}</td>
                  </tr>
                );

            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// Simple SVG line chart
function LineChart({ data, color, label, width=480, height=160 }) {
  const pad = {t:16,r:16,b:32,l:44};
  const w = width - pad.l - pad.r;
  const h = height - pad.t - pad.b;
  const max = Math.max(...data)*1.1;
  const min = 0;
  const pts = data.map((v,i)=>({
    x: pad.l + (i/(data.length-1))*w,
    y: pad.t + h - ((v-min)/(max-min))*h,
  }));
  const linePath = pts.map((p,i)=>`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const areaPath = linePath + ` L${pts[pts.length-1].x},${pad.t+h} L${pts[0].x},${pad.t+h} Z`;

  // Y axis labels
  const yTicks = 4;
  const yLabels = Array.from({length:yTicks+1},(_,i)=>Math.round(min+(max-min)*(i/yTicks)));

  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{width:"100%",height:"100%"}}>
      <defs>
        <linearGradient id={`grad-${label}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.18"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      {/* Grid */}
      {yLabels.map((v,i)=>{
        const y = pad.t + h - ((v-min)/(max-min))*h;
        return <g key={i}>
          <line x1={pad.l} y1={y} x2={pad.l+w} y2={y} stroke="#F0F2FA" strokeWidth="1"/>
          <text x={pad.l-6} y={y+4} textAnchor="end" fontSize="9" fill="#9EA3BD">{v}</text>
        </g>;
      })}
      {/* Area */}
      <path d={areaPath} fill={`url(#grad-${label})`}/>
      {/* Line */}
      <path d={linePath} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
      {/* Dots */}
      {pts.map((p,i)=>(
        <circle key={i} cx={p.x} cy={p.y} r="3.5" fill="#fff" stroke={color} strokeWidth="2"/>
      ))}
      {/* X labels */}
      {MONTHS.map((m,i)=>{
        const x = pad.l + (i/(data.length-1))*w;
        return <text key={m} x={x} y={height-6} textAnchor="middle" fontSize="9" fill="#9EA3BD">{m}</text>;
      })}
    </svg>
  );
}

// SVG bar chart
function BarChart({ data, width=380, height=200 }) {
  const pad = {t:12,r:12,b:12,l:80};
  const w = width - pad.l - pad.r;
  const h = height - pad.t - pad.b;
  const barH = Math.floor(h/data.length) - 6;
  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{width:"100%",height:"100%"}}>
      {data.map((d,i)=>{
        const y = pad.t + i*(h/data.length) + (h/data.length - barH)/2;
        const bw = (d.pct/100)*w;
        return (
          <g key={d.name}>
            <text x={pad.l-8} y={y+barH/2+4} textAnchor="end" fontSize="11" fontWeight="600" fill="#1A1D2E">{d.flag} {d.name}</text>
            <rect x={pad.l} y={y} width={bw} height={barH} rx="5" fill={d.color} opacity="0.9"/>
            <rect x={pad.l} y={y} width={w} height={barH} rx="5" fill={d.color} opacity="0.08"/>
            <text x={pad.l+bw+6} y={y+barH/2+4} fontSize="11" fontWeight="700" fill={d.color}>{d.pct}%</text>
          </g>
        );
      })}
    </svg>
  );
}

// ── HELPERS ────────────────────────────────────────────────────────────────
function initials(name) { return name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase(); }
function fmtMoney(n) { return n>=1000000 ? `$${(n/1000000).toFixed(1)}M` : n>=1000 ? `$${(n/1000).toFixed(0)}k` : `$${n}`; }

function AnimNum({ val, prefix="", suffix="", dur=1100 }) {
  const [d, setD] = useState(0);
  const t0 = useRef(null);
  useEffect(()=>{
    t0.current = null;
    const target = typeof val==="number" ? val : parseFloat(String(val).replace(/[^\d.]/g,""));
    const step = ts => {
      if(!t0.current) t0.current = ts;
      const p = Math.min((ts - t0.current)/dur, 1);
      const e = 1 - Math.pow(1-p,3);
      setD(Math.round(target*e));
      if(p<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [val]);
  const fmt = n => n>=1000 ? (n/1000).toFixed(1)+"k" : n;
  return <span>{prefix}{fmt(d)}{suffix}</span>;
}

function Sparkline({ color, data }) {
  const max = Math.max(...data);
  return (
    <div style={{ display:"flex", alignItems:"flex-end", gap:2, height:28, marginTop:4 }}>
      {data.map((v,i) => (
        <div key={i} style={{ flex:1, borderRadius:3, background: i===data.length-1 ? color : `${color}44`, height:`${(v/max)*100}%`, transition:`height 0.8s ease ${i*0.05}s` }} />
      ))}
    </div>
  );
}

function CountryBar({ name, flag, count, pct, color }) {
  const [w, setW] = useState(0);
  useEffect(()=>{ const t=setTimeout(()=>setW(pct),300); return()=>clearTimeout(t); },[pct]);
  return (
    <div className="country-item">
      <div className="country-info">
        <div className="country-name"><span>{flag}</span>{name}</div>
        <div style={{display:"flex",alignItems:"center"}}>
          <span className="country-count">{count}</span>
          <span className="country-pct">{pct}%</span>
        </div>
      </div>
      <div className="bar-track"><div className="bar-fill" style={{width:`${w}%`,background:color}} /></div>
    </div>
  );
}

function Badge({ state }) {
  const cfg = BADGE_CFG[state] || BADGE_CFG["Nuevo"];
  return <span className={`badge ${cfg.cls}`}><span className="badge-dot" />{cfg.label}</span>;

            <h2 style={{fontSize:36,fontWeight:900,color:"#fff",marginBottom:12,letterSpacing:"-0.02em"}}>Acceso <span style={{color:"#FF6B35"}}>Administrador</span></h2>
            <p style={{fontSize:15,color:"rgba(255,255,255,0.5)",lineHeight:1.7,marginBottom:28}}>Panel exclusivo para gestores del CRM. Administra usuarios, vendedores, países e integraciones desde un solo lugar.</p>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {[
                {ic:"👥",t:"Gestión de usuarios y roles"},
                {ic:"📊",t:"Reportes avanzados en tiempo real"},
                {ic:"⚙",t:"Configuración de integraciones"},
                {ic:"🛡",t:"Seguridad y control de acceso"},
                {ic:"🌎",t:"Gestión de mercados internacionales"},
              ].map((f,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:10,fontSize:13.5,color:"rgba(255,255,255,0.7)"}}>
                  <div style={{width:28,height:28,borderRadius:8,background:"rgba(255,107,53,0.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>{f.ic}</div>
                  {f.t}
                </div>
              ))}
            </div>
          </div>
          <div style={{background:"#fff",borderRadius:20,padding:36}}>
            <h3 style={{fontSize:18,fontWeight:800,color:"#0A2463",marginBottom:4}}>Acceder como Admin</h3>
            <p style={{fontSize:13,color:"#9EA3BD",marginBottom:24}}>Ingresa tus credenciales de administrador</p>
            <input className="admin-input" type="email" value={admin.email} onChange={e=>setAdmin(a=>({...a,email:e.target.value}))} placeholder="admin@tuempresa.com" style={{width:"100%",height:44,background:"#F5F6FA",border:"1.5px solid #E8EAF2",borderRadius:10,padding:"0 14px",fontFamily:"inherit",fontSize:14,color:"#1A1D2E",outline:"none",marginBottom:12}}/>
            <input className="admin-input" type="password" value={admin.pw} onChange={e=>setAdmin(a=>({...a,pw:e.target.value}))} placeholder="••••••••••" style={{width:"100%",height:44,background:"#F5F6FA",border:"1.5px solid #E8EAF2",borderRadius:10,padding:"0 14px",fontFamily:"inherit",fontSize:14,color:"#1A1D2E",outline:"none",marginBottom:18}}/>
            <button onClick={handleAdminLogin} style={{width:"100%",height:48,background:"#0A2463",color:"#fff",border:"none",borderRadius:11,fontFamily:"inherit",fontSize:14.5,fontWeight:800,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              🔐 Acceder como Admin
            </button>
            <div style={{textAlign:"center",marginTop:14,fontSize:13,color:"#9EA3BD"}}>
              <a style={{color:"#FF6B35",fontWeight:600,cursor:"pointer"}}>¿Olvidaste tu contraseña?</a> · <a style={{color:"#FF6B35",fontWeight:600,cursor:"pointer"}} onClick={goToDashboard}>Ir al Dashboard →</a>
            </div>
            {adminMsg && (
              <div style={{marginTop:14,padding:"10px 14px",borderRadius:9,fontSize:12.5,textAlign:"center",
                background: adminMsg.type==="ok" ? "#EDFAF4" : adminMsg.type==="loading" ? "#F5F6FA" : "#FFF0EC",
                color: adminMsg.type==="ok" ? "#22C55E" : adminMsg.type==="loading" ? "#6B7099" : "#FF6B35"}}>
                {adminMsg.text}
              </div>
            )}
          </div>
        </div>
      </section>

      {/* SOCIAL PROOF */}
      <section className="social-section">
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:12,fontWeight:800,color:"#C0C4D8",letterSpacing:"0.12em",textTransform:"uppercase"}}>Empresas que confían en LeadPro</div>
          <div className="logos-row">
            {["TechCorp","Iberdrola","LogiMex","BanPanamá","AgroFuturo","Retailes"].map(n=>(
              <div key={n} className="logo-pill">{n}</div>
            ))}
          </div>
        </div>
      </section>

      {/* FOOTER */}
      <footer className="demo-footer">
        <div className="footer-top">
          <div className="footer-brand">
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4}}>
              <svg width="28" height="28" viewBox="0 0 54 54" fill="none">
                <rect width="54" height="54" rx="13" fill="#FF6B35"/>
                <path d="M15 13 L15 41 L39 41" stroke="#fff" strokeWidth="6" strokeLinecap="round" strokeLinejoin="round"/>
                <path d="M31 18 L39 10 L47 18" stroke="#0A2463" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round"/>
                <line x1="39" y1="10" x2="39" y2="33" stroke="#0A2463" strokeWidth="5" strokeLinecap="round"/>
              </svg>
              <span style={{fontSize:17,fontWeight:900,color:"#fff"}}>Lead<span style={{color:"#FF6B35"}}>Pro</span> CRM</span>
            </div>
            <p>CRM con IA para equipos de ventas internacionales. Cierra más leads en menos tiempo.</p>
            <div className="footer-social">
              <div className="social-icon" style={{background:"#1877F2"}} title="Facebook">f</div>
              <div className="social-icon" style={{background:"linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366)"}} title="Instagram">ig</div>
              <div className="social-icon" style={{background:"#0A66C2"}} title="LinkedIn">in</div>
              <div className="social-icon" style={{background:"#25D366"}} title="WhatsApp">wa</div>
            </div>
          </div>
          {[
            {t:"Producto",l:["Dashboard","Leads","Vendedores","Reportes","Integraciones"]},
            {t:"Empresa",l:["Nosotros","Blog","Casos de éxito","Precios","Socios"]},
            {t:"Soporte",l:["Centro de ayuda","Documentación","Status del sistema","Contacto"]},
          ].map((c,i)=>(
            <div key={i}>
              <div className="footer-col-title">{c.t}</div>
              {c.l.map(x=><a key={x} className="footer-link" onClick={c.t==="Producto" && x==="Dashboard" ? goToDashboard : null}>{x}</a>)}
            </div>
          ))}
        </div>
        <div className="footer-bottom">
          <div className="footer-copy">© 2026 LeadPro CRM · Todos los derechos reservados</div>
          <div className="footer-badges">
            <div className="footer-badge">🔒 SSL Seguro</div>
            <div className="footer-badge">🇪🇺 GDPR</div>
            <div className="footer-badge">ISO 27001</div>
          </div>
          <div style={{display:"flex",gap:16}}>
            <a className="footer-link" style={{margin:0}}>Privacidad</a>
            <a className="footer-link" style={{margin:0}}>Términos</a>
            <a className="footer-link" style={{margin:0,color:"rgba(255,107,53,0.7)"}} onClick={goToDashboard}>→ Ir al CRM</a>
          </div>
        </div>
      </footer>
    </div>
  );
}

// ── PLACEHOLDER PAGE ───────────────────────────────────────────────────────
function PlaceholderPage({ id }) {
  const info = {
    clientes: { icon:"♟", title:"Clientes", sub:"Base de clientes activos" },
    paises:   { icon:"◉", title:"Países",   sub:"Cobertura internacional" },
    reportes: { icon:"▤", title:"Reportes", sub:"Análisis y métricas avanzadas" },
    config:   { icon:"⚙", title:"Configuración", sub:"Ajustes del sistema" },
  };
  const p = info[id] || { icon:"◈", title:id, sub:"" };
  return (
    <div className="content">
      <div className="page-header">
        <div><div className="page-title">{p.title}</div><div className="page-sub">{p.sub}</div></div>
      </div>
      <div className="empty-state" style={{marginTop:60}}>
        <div style={{fontSize:56,opacity:0.2}}>{p.icon}</div>
        <div style={{fontSize:16,fontWeight:700,color:"#C0C4D8"}}>{p.title}</div>
        <div style={{fontSize:13,color:"#D5D8E8"}}>Próximamente disponible</div>
      </div>
    </div>
  );
}

// ── APP ROOT ───────────────────────────────────────────────────────────────
function App() {
  const [activePage, setActivePage] = useState("dashboard");
  const [collapsed, setCollapsed]   = useState(false);
  const [notifOpen, setNotifOpen]   = useState(false);
  const [tweaks, setTweak]          = useTweaks(TWEAK_DEFAULTS);

  const accent  = tweaks.accentColor;
  const primary = tweaks.primaryColor;

  const renderPage = () => {
    switch(activePage) {
      case "dashboard":  return <DashboardPage accent={accent} primary={primary} leads={window.ALL_LEADS||[]} goToLeads={()=>setActivePage("leads")} />;
      case "leads":      return <LeadsPage accent={accent} primary={primary} />;
      case "vendedores": return <VendedoresPage accent={accent} primary={primary} />;
      case "clientes":   return <ClientesPage accent={accent} primary={primary} />;
      case "paises":     return <PaisesPage accent={accent} primary={primary} />;
      case "reportes":   return <ReportesPage accent={accent} primary={primary} />;
      case "config":     return <ConfiguracionPage accent={accent} primary={primary} />;
      case "demo":       return <DemoPage goToDashboard={()=>setActivePage("dashboard")} />;
      default:           return <PlaceholderPage id={activePage} />;
    }
  };

  // Demo page renders fullscreen without CRM chrome
  if (activePage === "demo") {
    return (
      <div className="app" style={{display:"block",height:"100vh",overflow:"hidden"}}>
        <button onClick={()=>setActivePage("dashboard")} style={{position:"fixed",top:16,left:16,zIndex:300,height:38,padding:"0 16px",background:"#0A2463",color:"#fff",border:"none",borderRadius:10,fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer",boxShadow:"0 4px 14px rgba(0,0,0,0.15)",display:"flex",alignItems:"center",gap:6}}>
          ← Volver al CRM
        </button>
        <DemoPage goToDashboard={()=>setActivePage("dashboard")} />
        <TweaksPanel>
          <TweakSection label="Colores" />
          <TweakColor label="Color Principal" value={tweaks.primaryColor} onChange={v=>setTweak("primaryColor",v)} />
          <TweakColor label="Color Acento"    value={tweaks.accentColor}  onChange={v=>setTweak("accentColor",v)} />
        </TweaksPanel>
      </div>
    );
  }

  return (
    <div className="app">
      {/* SIDEBAR */}
      <aside className="sidebar" style={{background:primary, width:collapsed?"64px":"240px", minWidth:collapsed?"64px":"240px"}}>
        <div className="sidebar-logo" onClick={()=>setCollapsed(c=>!c)}>
          <LogoIcon accent={accent} size={34} />
          {!collapsed && (
            <div>
              <div className="logo-text">Lead<span style={{color:accent}}>Pro</span></div>
              <div className="logo-sub">CRM PLATFORM</div>
            </div>
          )}
        </div>

        <nav className="sidebar-nav">
          {["main","gestion","sistema"].map(group => (
            <div key={group}>
              {!collapsed && (
                <div className="nav-label">
                  {group==="main"?"Principal":group==="gestion"?"Gestión":"Sistema"}
                </div>
              )}
              {NAV.filter(n=>n.group===group).map(item=>(
                <div key={item.id}
                  className={`nav-item ${activePage===item.id?"active":""}`}
                  style={activePage===item.id?{background:`${accent}22`,color:accent}:{}}
                  onClick={()=>setActivePage(item.id)}>
                  <span className="nav-icon">{item.icon}</span>
                  {!collapsed && <span>{item.label}</span>}
                  {!collapsed && item.badge && <span className="nav-badge" style={{background:accent}}>{item.badge}</span>}
                </div>
              ))}
            </div>
          ))}
        </nav>

        <div className="sidebar-footer">
          <div className="nav-item" style={{color:"rgba(255,255,255,0.4)"}} onClick={()=>setCollapsed(c=>!c)}>
            <span className="nav-icon">{collapsed?"▷":"◁"}</span>
            {!collapsed && <span style={{fontSize:12.5}}>Contraer</span>}
          </div>
        </div>
      </aside>

      {/* MAIN */}
      <div className="main">
        {/* HEADER */}
        <header className="header">
          <button className="header-toggle" onClick={()=>setCollapsed(c=>!c)}>≡</button>
          <div className="search-wrap">
            <span className="search-icon">🔍</span>
            <input className="search-input" placeholder="Buscar leads, clientes, países…" />
          </div>
          <div className="header-right">
            <div style={{position:"relative"}}>
              <button className="header-btn" onClick={()=>setNotifOpen(n=>!n)}>
                🔔<span className="notif-dot" />
              </button>
              {notifOpen && (
                <div className="notif-dropdown">
                  <div className="notif-hd">Notificaciones</div>
                  {[
                    {icon:"◎",text:"Nuevo lead: Valentina Ruiz (Chile)",time:"Hace 5 min",bg:`${accent}18`},
                    {icon:"✔",text:"Lead cerrado: Diego Castillo",time:"Hace 1 h",bg:"#E8FAF0"},
                    {icon:"▶",text:"Recordatorio: seguimiento a Jorge R.",time:"Hace 2 h",bg:"#FFF4EE"},
                  ].map((n,i)=>(
                    <div key={i} className="notif-item">
                      <div className="notif-icon" style={{background:n.bg}}>{n.icon}</div>
                      <div><div className="notif-text">{n.text}</div><div className="notif-time">{n.time}</div></div>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <button className="header-btn">⚙</button>
            <div style={{width:1,height:26,background:"#E8EAF2",margin:"0 2px"}} />
            <div className="user-info"><div className="user-name">Carlos Martínez</div><div className="user-role">Sales Manager</div></div>
            <div className="user-avatar" style={{background:`linear-gradient(135deg,${primary},${accent})`}}>CM</div>
          </div>
        </header>

        {/* PAGE */}
        <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
          {renderPage()}
        </div>
      </div>

      {/* TWEAKS */}
      <TweaksPanel>
        <TweakSection label="Colores" />
        <TweakColor label="Color Principal" value={tweaks.primaryColor} onChange={v=>setTweak("primaryColor",v)} />
        <TweakColor label="Color Acento"    value={tweaks.accentColor}  onChange={v=>setTweak("accentColor",v)} />
        <TweakSection label="Vista" />
        <TweakToggle label="Sparklines KPI" value={tweaks.showSparklines} onChange={v=>setTweak("showSparklines",v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
